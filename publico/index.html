<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Portal RDV — DISO</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icone.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/estilo.css">
<style>
  .abertura { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
  .caixa { width: 100%; max-width: 380px; }
  .entrada-topo { text-align: center; margin-bottom: 28px; }
  .entrada-topo .logo { width: 48px; height: 48px; display: block; margin: 0 auto 20px; }
  .entrada-topo h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.5px; }
  .entrada-topo p { margin: 8px 0 0; color: var(--texto-fraco); font-size: 15px; }
  .caixa .cartao { padding: 24px; }
  .rodape-login { text-align: center; margin-top: 24px; font-size: 13px; color: var(--texto-fraco); }
</style>
</head>
<body>

<div class="abertura">
  <div class="caixa">
    <div class="entrada-topo">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="#2d5bd7"/>
      <path d="M10 8h8l4 4v12H10z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
      <path d="M13.5 17l2 2 3.5-4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
      <h1>Entre no Portal RDV</h1>
      <p>Relatórios de despesas de viagem</p>
    </div>

    <div class="cartao">
      <div id="recado"></div>
      <form id="formulario">
        <label for="login">Usuário</label>
        <input id="login" name="login" type="text" autocomplete="username"
               autocapitalize="none" spellcheck="false" required>

        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>

        <button type="submit" style="width:100%" id="botao">Entrar</button>
      </form>
    </div>

    <p class="rodape-login">DISO Comércio de Alimentos</p>
  </div>
</div>

<script type="module" src="/js/entrar.js"></script>
</body>
</html>
