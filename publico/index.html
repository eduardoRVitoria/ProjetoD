<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1418">
<title>Portal RDV — DISO</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icone.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@75..125,400..800&display=swap">
<link rel="stylesheet" href="/css/estilo.css">
<style>
  .abertura {
    min-height: 100dvh;
    display: grid; place-items: center;
    padding: 24px;
  }
  .caixa { width: 100%; max-width: 400px; }

  /* A entrada e a partida do carro: o mostrador grande acende e o ponteiro
     sobe ate o topo. O resto da tela e so o formulario. */
  .partida { text-align: center; margin-bottom: 26px; }
  .partida .mostrador-grande { width: 132px; height: 132px; margin: 0 auto 18px; display: block;
    filter: drop-shadow(0 0 26px rgba(127, 227, 240, .35)); }
  .partida .ponteiro { transform-origin: 32px 42px; animation: sobe 1.2s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes sobe { from { transform: rotate(-95deg); } }
  .partida h1 { margin: 0; font-size: 40px; font-weight: 700; font-stretch: 85%; letter-spacing: .5px; line-height: 1; }
  .partida p { margin: 10px 0 0; color: var(--fraco); font-size: 16px; }
  .caixa .cartao { padding: 24px; }
  .rodape-login { text-align: center; margin-top: 20px; font-size: 13px; color: var(--fraco); }
</style>
</head>
<body>

<div class="abertura">
  <div class="caixa">
    <div class="partida">
      <svg class="mostrador-grande" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="29" fill="none" stroke="#7fe3f0" stroke-width="2.5"/>
        <path d="M14 42a18 18 0 0 1 36 0" fill="none" stroke="#2f4853" stroke-width="3" stroke-linecap="round"/>
        <path class="ponteiro" d="M32 42 43 26" stroke="#7fe3f0" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="32" cy="42" r="3.5" fill="#7fe3f0"/>
      </svg>
      <h1>Portal RDV</h1>
      <p>Relatórios de despesas de viagem</p>
    </div>

    <div class="cartao">
      <div id="recado"></div>
      <form id="formulario">
        <label for="login">Usuário</label>
        <input id="login" name="login" type="text" autocomplete="username"
               autocapitalize="none" spellcheck="false" required>

        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>

        <button type="submit" style="width:100%" id="botao">Entrar</button>
      </form>
    </div>

    <p class="rodape-login">DISO Comércio de Alimentos</p>
  </div>
</div>

<script type="module" src="/js/entrar.js"></script>
</body>
</html>
