<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5a36">
<title>Portal RDV — DISO</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icone.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/css/estilo.css">
<style>
  .abertura {
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .caixa { width: 100%; max-width: 420px; }

  /* A entrada e uma placa de rodovia: verde, filete branco por dentro, nome
     grande e a linha de destino embaixo. */
  .placa-entrada {
    background: var(--placa);
    color: #fff;
    border-radius: 14px;
    box-shadow: inset 0 0 0 6px var(--placa), inset 0 0 0 9px rgba(255, 255, 255, .95);
    padding: 30px 30px 26px;
    margin-bottom: 18px;
  }
  .placa-entrada .linha-topo {
    display: flex; align-items: center; gap: 14px;
  }
  .placa-entrada .logo { width: 46px; height: 46px; flex: 0 0 46px; }
  .placa-entrada h1 {
    margin: 0; font-size: 38px; font-weight: 800; letter-spacing: -.5px; line-height: 1;
  }
  .placa-entrada p {
    margin: 16px 0 0; padding-top: 14px;
    border-top: 2px solid rgba(255, 255, 255, .9);
    font-size: 17px; font-weight: 600; line-height: 1.3;
  }
  .caixa .cartao { padding: 24px; }
  .rodape-login {
    text-align: center; margin-top: 20px; font-size: 13px; color: var(--texto-fraco);
  }
</style>
</head>
<body>

<div class="abertura">
  <div class="caixa">
    <div class="placa-entrada">
      <div class="linha-topo">
        <svg class="logo" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <rect width="64" height="64" rx="14" fill="#ffffff"/>
          <path d="M14 40h36M20 40V26l6-8h13l6 8v14" stroke="#0b5a36" stroke-width="3.6"
                stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="24" cy="44" r="4.5" fill="#ffffff" stroke="#0b5a36" stroke-width="3.6"/>
          <circle cx="42" cy="44" r="4.5" fill="#ffffff" stroke="#0b5a36" stroke-width="3.6"/>
        </svg>
        <h1>Portal RDV</h1>
      </div>
      <p>Relatórios de despesas de viagem</p>
    </div>

    <div class="cartao">
      <div id="recado"></div>
      <form id="formulario">
        <label for="login">Usuário</label>
        <input id="login" name="login" type="text" autocomplete="username"
               autocapitalize="none" spellcheck="false" required>

        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>

        <button type="submit" style="width:100%" id="botao">Entrar</button>
      </form>
    </div>

    <p class="rodape-login">DISO Comércio de Alimentos</p>
  </div>
</div>

<script type="module" src="/js/entrar.js"></script>
</body>
</html>
